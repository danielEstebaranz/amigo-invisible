<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amigo Invisible</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🎁</span>
      <div>
        <h1 id="event-title">Amigo Invisible</h1>
        <p class="subtitle" id="budget-badge"></p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="grupo" role="tab">👥 Grupo</button>
    <button class="tab" data-tab="perfil" role="tab">🙋 Perfil</button>
    <button class="tab" data-tab="sorteo" role="tab">🎲 Sorteo</button>
  </nav>

  <main>
    <!-- GRUPO -->
    <section id="tab-grupo" class="panel active">
      <div class="card">
        <h2>Configuración</h2>
        <label class="field">
          <span>Nombre del evento</span>
          <input id="event-name" type="text" maxlength="40" placeholder="Navidad en la oficina">
        </label>
        <label class="field">
          <span>Límite de precio (€)</span>
          <div class="price-row">
            <input id="price-limit" type="number" min="1" max="1000" step="1">
            <div class="chips" id="price-presets">
              <button type="button" class="chip" data-price="10">10 €</button>
              <button type="button" class="chip" data-price="20">20 €</button>
              <button type="button" class="chip" data-price="30">30 €</button>
              <button type="button" class="chip" data-price="50">50 €</button>
            </div>
          </div>
        </label>
      </div>

      <div class="card">
        <h2>Participantes <span class="count" id="participant-count"></span></h2>
        <form id="add-form" class="add-row">
          <input id="new-name" type="text" maxlength="30" placeholder="Nombre del participante" autocomplete="off">
          <button class="btn primary" type="submit">Añadir</button>
        </form>
        <ul id="participant-list" class="list"></ul>
        <p class="hint" id="group-hint"></p>
      </div>
    </section>

    <!-- PERFIL -->
    <section id="tab-perfil" class="panel">
      <div class="card">
        <h2>Perfil</h2>
        <label class="field">
          <span>¿Quién eres?</span>
          <select id="profile-select"></select>
        </label>
        <div id="profile-body"></div>
      </div>
      <div class="card" id="profile-recs-card" hidden>
        <h2>Ideas para regalarte</h2>
        <p class="hint">Así verá tu amigo invisible las recomendaciones según tus gustos y el presupuesto.</p>
        <div id="profile-recs"></div>
      </div>
    </section>

    <!-- SORTEO -->
    <section id="tab-sorteo" class="panel">
      <div class="card" id="draw-card"></div>
    </section>
  </main>

  <dialog id="reveal-dialog">
    <div id="reveal-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
